# Full local stack for testing. Run with:
#   docker compose -f docker-compose.local.yml up --build
#
# Services:
#   postgres  → localhost:7432
#   redis     → localhost:7379
#   api       → localhost:7100
#   worker    → (no port, processes background jobs)

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "7432:5432"
    environment:
      POSTGRES_DB: lakeb2b_scraper
      POSTGRES_USER: scraper
      POSTGRES_PASSWORD: scraper_dev
    volumes:
      - pgdata_local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scraper -d lakeb2b_scraper"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "7379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "7100:7100"
    environment:
      PORT: "7100"
      DATABASE_URL: "postgresql://scraper:scraper_dev@postgres:5432/lakeb2b_scraper"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: "local-dev-secret-do-not-use-in-production"
      LAKECURRENT_ENABLED: "false"
      LOG_LEVEL: "debug"
      SCREENSHOT_DIR: "/app/data/screenshots"
      SESSION_SECRET: "local-session-secret-change-me"
      # Auth: default "legacy" (password login). Flip to "clerk" and fill the
      # CLERK_* vars below (from your Clerk dev instance) to test Clerk.
      AUTH_PROVIDER: "legacy"
      # CLERK_PUBLISHABLE_KEY: "pk_test_..."
      # CLERK_SECRET_KEY: "sk_test_..."
      # CLERK_JWKS_URL: "https://<subdomain>.clerk.accounts.dev/.well-known/jwks.json"
      # CLERK_ISSUER: "https://<subdomain>.clerk.accounts.dev"
      # CLERK_DOMAIN: "<subdomain>.clerk.accounts.dev"
      # Experimental Go fetcher sidecars (Python fetchers stay default)
      ENABLE_GO_FETCHERS: "true"
      GO_HTTP_FETCHER_URL: "http://go-http-fetcher:8080"
      GO_BROWSER_FETCHER_URL: "http://go-browser-fetcher:8080"
      # v2.1 Enrichment Edition (parse/search/enrich + inbound protection)
      ENABLE_DOCUMENT_PARSING: "true"
      ENABLE_SEARCH_API: "true"
      ENABLE_ENRICHMENT: "true"
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_PER_MINUTE: "60"
      ENABLE_CREDIT_ENFORCEMENT: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - screenshots_local:/app/data/screenshots
    command: ./start.sh

  worker:
    build: .
    environment:
      DATABASE_URL: "postgresql://scraper:scraper_dev@postgres:5432/lakeb2b_scraper"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: "local-dev-secret-do-not-use-in-production"
      LAKECURRENT_ENABLED: "false"
      LOG_LEVEL: "debug"
      SCREENSHOT_DIR: "/app/data/screenshots"
      ENABLE_GO_FETCHERS: "true"
      GO_HTTP_FETCHER_URL: "http://go-http-fetcher:8080"
      GO_BROWSER_FETCHER_URL: "http://go-browser-fetcher:8080"
      # Tier 3 proxy — uncomment and set for headless + residential proxy:
      # BRIGHTDATA_PROXY_URL: "http://user:pass@brd.superproxy.io:22225"
      # SMARTPROXY_URL: "http://user:pass@gate.smartproxy.com:10000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - screenshots_local:/app/data/screenshots
    command: arq src.queue.worker.WorkerSettings

  go-http-fetcher:
    build: ./go-fetchers/http
    environment:
      PORT: "8080"

  go-browser-fetcher:
    build: ./go-fetchers/browser
    environment:
      PORT: "8080"

volumes:
  pgdata_local:
  screenshots_local:
